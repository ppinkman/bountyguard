name: BountyGuard checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  revision_binding:
    name: "${{ github.event_name == 'pull_request' && format('BountyGuard PR {0} base {1}', github.event.pull_request.number, github.event.pull_request.base.sha) || 'Push metadata' }}"
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: 'true'
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Run the Agent container isolation probe
        if: github.event_name == 'push'
        run: |
          build_dir="$(mktemp -d)"
          cp requirements.txt requirements-dev.txt tools/agent-demo.Dockerfile "$build_dir/"
          docker build -t bountyguard-demo-tests -f "$build_dir/agent-demo.Dockerfile" "$build_dir"
          image_id="$(docker image inspect bountyguard-demo-tests --format '{{.Id}}')"
          test -n "$image_id"
          BOUNTYGUARD_TEST_IMAGE="$image_id" python -m unittest discover -s tests -p test_secret_isolation.py -v
      - run: python -m compileall -q bountyguard tools
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- bountyguard/web/wallet-bundle.js
  contract:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: rustup default stable
      - run: cargo test --locked --lib
        working-directory: contracts/bounty
      - run: cargo build --locked --target wasm32-unknown-unknown --release
        working-directory: contracts/bounty
