[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bountyguard"
version = "0.1.0"
description = "GitHub bounty payments through NEAR testnet escrow"
requires-python = ">=3.11"
dependencies = ["fastapi==0.139.0", "uvicorn==0.51.0", "pydantic==2.12.5", "cryptography==46.0.4", "mcp==2.3.0"]

[tool.setuptools.packages.find]
include = ["bountyguard*"]

[tool.setuptools.package-data]
bountyguard = ["web/*"]
